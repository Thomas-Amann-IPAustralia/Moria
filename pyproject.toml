[project]
name = "moria"
version = "0.1.0"
description = "A broad signal-detection and validation engine for IP Australia's strategic foresight"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.35",
    "defusedxml>=0.7",
    "duckdb>=1.1",
    "google-auth>=2.30",
    "httpx>=0.27",
    "numpy>=2.4.6",
    "openpyxl>=3.1",
    "pyarrow>=26.0.0",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "typer>=0.12",
    "zstandard>=0.23",
]

[project.scripts]
moria = "moria.cli:app"

[project.optional-dependencies]
models = [
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moria"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
