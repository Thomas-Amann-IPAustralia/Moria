id: openalex_counts
name: OpenAlex works counted over the whole topic taxonomy
adapter: openalex_counts
rings: [adjacent, wider_world]
domains: [D0, D3]
family: research
cadence: weekly
publication_lag: "days to months: OpenAlex indexes new works continuously, and recent periods fill in late"
coverage: >-
  Every work in OpenAlex's core corpus, counted by its primary topic at all four levels of the topic taxonomy
  (4 domains, 26 fields, 252 subfields, about 4,500 topics), for each publication year from 2010 and each of the last
  36 months; worldwide, and for works with at least one author at an Australian institution.
history_start: "2010 here (configurable; OpenAlex reaches far earlier)"
stable_since: "the topic taxonomy introduced in 2024 (to confirm in the census)"
breaks: []
known_biases:
  - Recent periods fill in late, so a month's count keeps rising for months after it ends (each run is a vintage)
  - Works dated by year only are given 1 January, which inflates January
  - Topics come from OpenAlex's own classifier; a change to it is a break, not a trend
  - Australia means an author's affiliation, not the subject
  - Coverage of non-English and non-journal output is uneven
revision_policy: every period is re-counted each run; each run is kept as a vintage
licence: "OpenAlex data are CC0. The API's free budget is 10,000 credits a day with a key; the key has no prepaid balance, so it is never billed"
snapshot_rights: counts stored
expected_volume: {min_per_run: 400, max_per_run: 500}
params:
  from_year: 2010
  months_back: 36
  levels: [domain, field, subfield, topic]
  scopes: [world, au]
  max_credits: 4000
  reserve_credits: 1000
