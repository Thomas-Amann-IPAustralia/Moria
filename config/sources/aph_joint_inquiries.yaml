adapter: feed
rings: [core, adjacent]
domains: [D1, D6]
family: policy
cadence: daily
publication_lag: same day to a few days
coverage: >-
  New inquiries of joint committees of both Houses, from the Department of the House's feed
history_start: "the feed was empty on 2026-10-12"
stable_since: null
breaks: []
