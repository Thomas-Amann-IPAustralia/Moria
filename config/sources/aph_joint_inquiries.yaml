licence: >-
  CC BY-NC-ND 4.0 (aph.gov.au's copyright notice: all content except the Commonwealth Coat of Arms and where otherwise
  noted). Moria's use is non-commercial research (the owner, D-017). NoDerivatives: Moria's adaptations (extracted
  text, embeddings, summaries) are for its own use and are not shared
snapshot_rights: >-
  titles, links, dates and the feed's summaries stored (the owner, D-017); shared outputs quote unaltered with
  attribution, or link
expected_volume: {min_per_run: 0, max_per_run: 20}
params:
