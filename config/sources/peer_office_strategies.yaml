id: peer_office_strategies
name: Peer IP offices' strategies and corporate plans (read once; again with each new edition)
adapter: documents
rings: [core]
domains: [D1, D5, D6]
family: policy
cadence: once
publication_lag: "yearly plans, published around the start of each office's financial year"
coverage: >-
  What peer IP offices say they will invest in and change (design §2.3, sub-question 7): the UKIPO's corporate
  plan, the EPO's strategic plan and annual work plan, the USPTO's strategy page, the EUIPO's Strategic Plan 2030,
  the JPO's Status Report and CIPO's business strategy (the last two as owner uploads, docs/wishlist.md). IPONZ's
  newest published business plan is for 2021-22; IPOS forbids reproduction; KIPO is still to find.
history_start: null
stable_since: null
breaks: []
known_biases:
  - Offices' own statements of intent, not outcomes; annual reports would add results
revision_policy: each new edition is a new document
licence: "per document (see each entry); text stored only where the document's licence allows it"
snapshot_rights: per document; otherwise the title, URL, hash, size and page count only
expected_volume: {min_per_run: 1, max_per_run: 10}
params:
  max_bytes: 60000000
  max_pages: 500
  documents:
    - id: ukipo_corporate_plan_2026_27
      title: "Intellectual Property Office Corporate Plan 2026 to 2027"
      publisher: UK Intellectual Property Office
      published: "2026-05-11"
      url: https://www.gov.uk/government/publications/intellectual-property-office-corporate-plan-2026-to-2027/intellectual-property-office-corporate-plan-2026-to-2027
      licence: "Open Government Licence v3.0 (GOV.UK)"
      store_text: true
      note: The HTML version of the plan
    - id: epo_strategic_plan_2028
      title: "EPO Strategic Plan 2028"
      publisher: European Patent Office
      url: https://www.epo.org/en/about-us/office/strategic-plan-2028
      licence: >-
        EPO website terms of use, section 6: the EPO's own information may be downloaded, printed and processed for
        private and commercial purposes, displayed accurately and citing the website; third-party content, logos and
        images excluded (read 2026-10-12). Metadata only until the owner confirms
      store_text: false
    - id: uspto_strategy
      title: "USPTO strategy and reporting (the strategic plan's page)"
      publisher: United States Patent and Trademark Office
      url: https://www.uspto.gov/about-us/performance-and-planning/strategy-and-reporting
      licence: "US federal government work: public domain (USPTO website terms); acknowledge the USPTO"
      store_text: true
      note: The link for the 2022-2026 plan's PDF now leads to this page
    - id: epo_annual_work_plan_2026
      title: "EPO Annual Work Plan 2026 (how the EPO carries out its Strategic Plan 2028)"
      publisher: European Patent Office
      url: https://link.epo.org/web/about-us/transparency-portal/en-annual-work-plan-2026.pdf
      licence: "EPO website terms of use, section 6 (see epo_strategic_plan_2028); metadata only until the owner confirms"
      store_text: false
    - id: euipo_strategic_plan_2030
      title: "EUIPO Strategic Plan 2030"
      publisher: European Union Intellectual Property Office
      published: "2024-11-21"
      url: https://euipo.europa.eu/tunnel-web/secure/webdav/guest/document_library/contentPdfs/about_euipo/strategic_plan/strategic-plan-2030_en.pdf
      licence: "EUIPO (its legal notice refuses the build session; checked on the document)"
      store_text: if_open_licence
      note: In force from 2025-01-01. The PDF answers the build session; the EUIPO's pages answer 403
    - id: jpo_status_report_2026
      title: "JPO Status Report 2026"
      publisher: Japan Patent Office
      published: "2026-03-23"
      url: https://www.jpo.go.jp/e/resources/report/statusreport/2026/index.html
      licence: "JPO website terms (to confirm; the site answers 403 to the build session); checked on the document"
      store_text: if_open_licence
      note: Statistics and the JPO's policy outcomes for 2025. An owner upload (the whole report, about 25 MB)
    - id: cipo_business_strategy_2023_2028
      title: "CIPO 2023-2028 Business Strategy"
      publisher: Canadian Intellectual Property Office
      published: "2023-02-23"
      url: https://www.canada.ca/en/intellectual-property-office/news/2023/02/cipo-releases-its-20232028-business-strategy.html
      licence: >-
        Government of Canada terms: non-commercial reproduction without charge or further permission, with the title,
        the author and a statement that it is not an official version (according to search results; canada.ca refuses
        the build session). Metadata only until the owner confirms
      store_text: false
      note: The release page; the strategy itself is linked from it. An owner upload
