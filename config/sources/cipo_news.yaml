id: cipo_news
name: Canadian Intellectual Property Office news (Canada News Centre)
adapter: feed
rings: [core]
domains: [D1, D5, D6]
family: policy
cadence: daily
publication_lag: same day
coverage: >-
  CIPO's news releases and statements through the Government of Canada's news API (Atom). Low volume: 23 items on
  2026-10-12, the newest dated 2025-11-26.
history_start: "the API's archive (23 items on 2026-10-12)"
stable_since: null
breaks: []
known_biases:
  - Low volume; some CIPO notices are published on ISED's own site instead, which this feed misses
revision_policy: items can be updated in place (the Atom updated field)
licence: >-
  Canada.ca terms of use (not reachable from the build session to confirm). Titles, links and dates are stored until
  the terms are confirmed
snapshot_rights: titles, links and dates only (the summaries are dropped)
expected_volume: {min_per_run: 0, max_per_run: 10}
params:
  url: https://api.io.canada.ca/io-server/gc/news/en/v2?dept=intellectualpropertyoffice&sort=publishedDate&orderBy=desc&pick=50&format=atom
  lookback_days: 3
  keep_summary: false
