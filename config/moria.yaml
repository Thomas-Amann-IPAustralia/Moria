# Moria settings (validated by moria.config.MoriaConfig; unknown keys are errors).
store:
  backend: local            # GitHub Actions passes --store r2
  bucket: moria
  local_root: data/store    # git-ignored
  account_id_env: R2_ACCOUNT_ID
  access_key_id_env: R2_ACCESS_KEY_ID
  secret_access_key_env: R2_SECRET_ACCESS_KEY

http:
  user_agent: "Moria/0.1 (+https://github.com/Thomas-Amann-IPAustralia/Moria; public-data horizon scanning)"
  timeout_s: 90
  max_retries: 3
  backoff_s: 5
  default_min_interval_s: 1.0
  host_min_interval_s:
    api.gdeltproject.org: 5.5       # GDELT asks for at most one request every 5 seconds
    www.ipaustralia.gov.au: 2.0
    www.wipo.int: 2.0
    www.aph.gov.au: 2.0
    www.abs.gov.au: 1.0
    www.kipo.go.kr: 3.0
    www.gov.uk: 1.0
    api.prod.legislation.gov.au: 1.0
    api.openalex.org: 0.2
    api.oecd.org: 2.0
    sdmx.oecd.org: 6.0              # the OECD limits its Data API (as few as 20 data downloads an hour, D-020)
    stip.oecd.org: 2.0
    data.csiro.au: 2.0
    oecd.ai: 2.0
    api.oecd.ai: 2.0
    wp.oecd.ai: 2.0
    news.un.org: 2.0
    theconversation.com: 2.0
    www.aspistrategist.org.au: 2.0
    www.lowyinstitute.org: 2.0
    www.federalregister.gov: 1.0
    ec.europa.eu: 2.0
    www.standards.org.au: 2.0
    rss.arxiv.org: 3.0              # arXiv's API terms: at most one request every three seconds

# Logical name -> the environment variable that holds it (docs/setup.md). Values never appear in config or logs.
secrets:
  openalex: OPENALEX_API_KEY
  r2_account_id: R2_ACCOUNT_ID
  r2_access_key_id: R2_ACCESS_KEY_ID
  r2_secret_access_key: R2_SECRET_ACCESS_KEY
  gcp_project: GCP_PROJECT_ID   # BigQuery patent counts; not set up yet (D-011, docs/setup.md)
  gcp_sa_key: GCP_SA_KEY        # a service account key's JSON (BigQuery Job User on a project with no billing)
