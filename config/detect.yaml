# The detectors and artefact checks (design §8.2, §8.3, §8.5; day 4). Validated by moria.config.DetectConfig; unknown
# keys are errors. Claude's engineering settings (D-022); the owner adopts measured changes.
version: 1

series:
  # Sources whose series are tested. Left out: wipo_ipstats (stale: its files end in 2022; 966,306 office-by-origin
  # series with a median of 4 years) and abs_datacubes (one period per table until more releases arrive).
  sources: [openalex_counts, patent_cpc_counts, abs_headline, oecd_headline, gdelt_news, ip_rapid_metrics]
  # Trend windows in periods. Monthly: the design's 12, 24 and 36 months. Other frequencies get windows long enough
  # for the test to pass at all after Holm: 8 annual points can never reach p < 1e-4.
  windows: {M: [12, 24, 36], Q: [8, 16, 24], A: [8, 12, 16], D: [28, 56, 84]}
  min_coverage: 0.9          # a window is tested only if this share of its periods (excluded months aside) is present
  min_mean_count: 5          # count series: mean count per period in the window; smaller series go to the surge test
  alpha: 0.05                # trends, accelerations and surges: Holm-adjusted within each family
  trend_min_windows: 2       # design §8.2: significant in at least 2 of 3 windows
  anomaly_alpha: 0.01        # the 99% band, family-wise (Holm) across the taxonomy
  anomaly_min_change: 0.25   # and at least 25% off the expected value (counts; statistics: of their level or spread)
  accel_min_change: 0.10     # an acceleration changes the yearly growth rate (counts) or slope over level by >= 0.10
  anomaly_baseline: {M: 24, Q: 12, A: 8, D: 28}  # points before the latest one that the band is fitted on
  stale_after: {M: 6, Q: 4, A: 3, D: 7}          # a series whose last period is older than this is not tested
  change_points:
    penalty_factor: 3        # times BIC's: 0.3–0.6% of noise series split at 36 points, against 12–17% at BIC (D-022)
    min_size: {M: 6, Q: 4, A: 4, D: 7}           # shortest segment of a slope
    min_size_level: {M: 3, Q: 2, A: 2, D: 4}     # shortest segment of a level (the calibration used 3)
    recent: {M: 3, Q: 2, A: 2, D: 7}             # a level change counts as an anomaly when the new level has lasted
                                                 # at most min_size_level plus this many periods
    level_frequencies: [M, Q, D]                 # annual series: 'recent' would mean years, and 7.6% of them fired
  bootstrap: {reps: 300, seed: 20261014}
  surge:                     # low-base surges: the latest periods against a trailing baseline, exact Poisson test
    window: {M: 3, Q: 2, A: 1, D: 7}
    baseline: {M: 12, Q: 8, A: 5, D: 28}
    min_count: 5             # design §8.2: at least 5 items
    max_expected: 5.0        # a low base: the baseline rate predicts at most this many in the window
    min_ratio: 2.0
  # Trailing periods dropped as incomplete, beyond the period that contains as_of (never complete). A series id
  # matching a prefix uses the first match.
  lags:
    # Patent families by priority year fill in for years: publication at 18 months, an Australian member after the
    # national phase (30 or 31 months) and its publication. With 2 years' lag the last year tested was still about a
    # third short for Australia (D-031), so 4 for Australian members and 3 worldwide (D-032).
    - {pattern: '^patent_cpc_counts\|[^|]+\|au$', periods: 4}
    - {prefix: "patent_cpc_counts|", periods: 3}
    - {prefix: "oecd_headline|OECD.STI.PIE:DSD_PATENTS", periods: 3}  # patents by priority fill in for about 3 years
    # OpenAlex's latest months are still being indexed, and what arrives first is not a sample of the month (D-031:
    # every monthly anomaly fell in the latest month), so the last 2 months are left out (D-032)
    - {pattern: '^openalex_counts\|.*\|month$', periods: 2}
    # IP RAPID designs: a release's last month holds no Locarno class or Australian applicant yet (D-022)
    - {pattern: '^ip_rapid_metrics\|[a-z_]+\|design', periods: 2}
  exclude_months:            # calendar months left out of monthly series
    openalex_counts: [1]     # works dated by year only are given 1 January (the card)
  divergence_reference: {openalex_counts: world, patent_cpc_counts: world, gdelt_news: world, oecd_headline: OECD}
  # Scopes tested, where a source covers many countries: Australia, the aggregates, and the economies that file most
  # in Australia or are its peers (D-022). Without this, small economies' volatility filled the anomalies.
  scopes:
    oecd_headline: [AUS, OECD, W, EU27_2020, G7, USA, CHN, JPN, KOR, DEU, GBR, FRA, CHE, NLD, SWE, CAN, NZL, SGP, IND,
                    ISR, TWN]
  exclude_dims:              # series left out: the same indicator is also published in a comparable unit
    - {source: oecd_headline, dims: {UNIT_MEASURE: XDC}}   # national currency at current prices (inflation; USD PPP too)
  # Series left out by id: CPC subclasses that are only indexing schemes (a family's main classes also count it), and
  # the legacy US cross-reference art collections (D-032). Y02 and Y04 (climate and smart-grid tagging) stay.
  exclude_series:
    - '^patent_cpc_counts\|(A23V|B29K|B29L|B60Y|C12R|F05B|F05C|F05D|F21W|F21Y|Y10S|Y10T)\|'
  openalex_parent_share: true    # an OpenAlex count as a share of its parent in the taxonomy (D-032)

documents:
  window_days: 91            # the weak-signal window ends at as_of
  baseline_days: 730         # the trailing baseline before the window
  credible_families: [research, patent, legal, policy]   # design §8.2, new_term
  min_items: 3               # design §8.2: a weak signal has at least 3 items (one per de-duplication group)
  min_sources: 2             # from at least 2 sources
  new_term_min_df: 3         # k: window documents holding the new phrase
  cross_family_min: 3        # families in the window
  cross_family_max_before: 1 # families in the baseline
  surge_min_ratio: 2.0
  surge_max_expected: 5.0
  surge_min_baseline_items: 200   # a family's baseline must hold this many items for a rate to mean anything
  alpha: 0.05
  combination_min_items: 3
  combination_min_each_before: 3  # each phrase of a new pair already appeared this often in the baseline
  combination_lift_ratio: 2.0     # a rising pair: its lift at least doubled
  # a cluster's name: its representative item's title (nearest its centre, a window item first) and 3 keyphrases
  clusters: {k: 200, seed: 20261014, batch: 4096, sample: 60000, name_terms: 5, name_title: true,
             name_title_terms: 3}
  novelty:
    neighbours: 20
    min_baseline: 500        # items a family's baseline needs before its novelty is scored
    baseline_sample: 20000
    threshold: -1.5          # LOF's decision function below this is novel (scikit-learn's offset is -1.5)
    micro_distance: 0.25     # cosine distance at which novel items join one micro-cluster (average linkage)
  ipr_window_months: 12      # IP RAPID class pairs: the window, and the baseline before it
  ipr_baseline_months: 60
  ipr_recent_months: 24      # and the latest 24 of them: a pair rises above, or fades below, these too (D-032)
  ipr_min_applicants: 2      # a class pair's applications come from at least this many applicants

artefacts:
  coverage_change: 0.25      # design §8.3: flag if the source's total moved more than ±25% in the window
  duplicate_ratio: 2.0       # raw items over de-duplicated items
  news_cycle_days: 14        # a news-only burst inside this span, with no primary source
  primary_families: [research, patent, policy, legal, statistics, ipa_internal]
  # Reclassifications: a class emptied into new ones moves its counts, not its activity (D-031). A series candidate
  # on these classes whose window crosses the date is flagged source_break (D-032). Patent families by priority year
  # (patent_cpc_counts) carry their classes at publication, about 18 months on, so a change takes effect there from
  # priority years about 18 months before it; IP RAPID's classes are dated by the month they became observable.
  # A change point many of a source's series share (one frequency): at least min_series of them, and factor times the
  # median period's count, flag source_break on the candidates that rest on it (D-032: 54 OpenAlex monthly series
  # changed slope in 2025-11, against about 5 a month).
  shared_break: {min_series: 10, factor: 4}
  series_breaks:
    - {date: "2020-07-01", pattern: '^patent_cpc_counts\|(G06K|G06V)\|',
       note: "CPC 2022.01: image and video recognition moved from G06K 9 to the new G06V (priority years from mid-2020)"}
    - {date: "2022-01-01", pattern: '^ip_rapid_metrics\|.*\|(G06K|G06V)$',
       note: "IPC 2022.01: image and video recognition moved from G06K 9 to the new G06V"}
    - {date: "2021-07-01", pattern: '^patent_cpc_counts\|(H01L|H10B|H10K|H10N)\|',
       note: "CPC 2023.01: memory, organic and other solid-state devices moved from H01L to H10B, H10K and H10N (priority years from mid-2021)"}
    - {date: "2023-01-01", pattern: '^ip_rapid_metrics\|.*\|(H01L|H10B|H10K|H10N)$',
       note: "IPC 2023.01: memory, organic and other solid-state devices moved from H01L to H10B, H10K and H10N"}
    - {date: "2025-01-01", pattern: '^ip_rapid_metrics\|.*\|(H01L|H10D|H10F|H10H)$',
       note: "IPC 2025.01: semiconductor devices, photovoltaics and light-emitting devices moved from H01L to H10D, H10F and H10H"}

# ---------------------------------------------------------------------------------------------------------------------
# The SignalBoost proposal (docs/SignalBoost-Proposal.md; D-025). Every scan measures these; `moria eval detectors`
# scores them against day 4's detectors; a new detector adds candidates only when switched on in `new_detectors`, the
# owner's call once the evaluation shows it adds value (the proposal's item 4).

horizons:
  # Horizons in months, each read by the method that suits it. A horizon becomes each frequency's periods (6 months
  # = 2 quarters = 182 days); one shorter than a period, or longer than a series' history, is not tested. Holm
  # adjusts within each test family, horizon and method. Overlapping horizons are views of one series, never
  # corroboration of each other.
  short:    # a shift in the recent mean against the trailing baseline's line: short-term anomalies
    months: [3, 6]
    baseline_factor: 4       # the baseline is 4 times the horizon, and at least the series' anomaly_baseline
    min_baseline: 0.75       # share of the baseline's periods present; the horizon's own periods all present
    alpha: 0.01
    min_change: 0.25
  medium:   # Theil-Sen and Mann-Kendall: sustained trends
    months: [12, 36]
    min_points: 8            # 4 quarters or 3 years can never pass after Holm, so they are not tested
  long:     # long-run trends and structural breaks (a change in the long-run slope or level)
    months: [60, 120, 180]
    min_points: 10
    min_segment_months: 24   # the shortest segment either side of a break (and at least change_points.min_size)
    penalty_factor: 6        # change points, times BIC's: on null series built from real noise (a separate seed),
                             # 3 split 15% of nulls, 6 split 5-6% (day 4's band flags 4.4% of the same), 10 no fewer
                             # and found half as many planted breaks (D-025)
    autocorrelation: true    # Mann-Kendall's variance inflated by the residuals' lag-1 autocorrelation
  by_source:                 # where a source's history allows fewer horizons (measured 2026-10-15, D-025)
    gdelt_news: [3, 6]

context:
  # The latest value against a ridge regression on its context, fitted on the baseline before it: a time trend, the
  # mean of its peers (the series of its own test family whose changes moved most like it over the baseline), the
  # world or OECD counterpart for an Australian series, and the source's volume for a share.
  baseline: {M: 24, Q: 16, A: 12, D: 56}
  min_baseline: 0.9          # share of the baseline's periods present (excluded months aside)
  peers: 5
  peer_min_corr: 0.5         # a peer's first differences correlate at least this well with the series'
  ridge: 0.1                 # times the baseline's length, on standardised covariates (the intercept is free)
  alpha: 0.01                # Holm within each test family
  min_change: 0.25           # as anomaly_min_change
  explained_share: 0.5       # a band anomaly is 'explained by context' when the context predicts this share of it
  annotate_explained: true   # the owner (D-028): the dossiers show it, while contextual_anomaly stays off
  coupling:                  # an Australian series' changes against its counterpart's: early half against recent
    min_points: 24
    max_points: 72
    alpha: 0.05
    established: 0.5         # a correlation at least this strong is an established relationship
    broken: 0.2              # and one this weak or weaker is none

relationships:
  # Breakdowns: an established pair (keyphrases, IPC subclasses, Nice classes, or an applicant country and a class)
  # whose co-occurrence falls well below what its baseline lift predicts from each side's activity in the window.
  fade_min_baseline: 10      # groups or applications holding both in the baseline
  fade_min_expected: 5.0     # the window should have held at least this many at the baseline's lift
  fade_ratio: 0.5            # and its lift at most halved
  fade_min_each_window: 3    # each side still active in the window (otherwise one side faded, not the pair)
  jurisdictions: true        # applicant countries by IPC subclass and Nice class (IP RAPID): new, rising, fading

redundancy:
  # Correlated indicators are not independent corroboration: flagged series whose first differences correlate at
  # least this strongly over the longest trend window share a redundancy group (average linkage).
  min_corr: 0.8
  min_points: 12
  # Within one source (D-032): across sources, annual series of 12 to 16 points sharing the 2020-21 shocks were
  # grouped by chance (mining profits with a population; D-031)
  within: source

evaluation:
  # `moria eval detectors`: injections into real series, null series built from their own noise, artefacts, and a
  # backtest at past dates. The retention rules are committed here before the first run (design §11.1).
  seed: 20261015
  per_class: 40              # real series per injection and per class (source and frequency)
  injections:
    spike: 1.0               # the latest period doubled (day 4's band should catch it)
    shift: 0.6               # the last 3 months 60% higher (short horizons)
    slope: 0.25              # yearly growth 0.25 higher over the last 36 months (trends, accelerations)
    structural: 0.15         # yearly growth 0.15 higher from 60 months back (long horizons)
    contextual: 0.6          # the latest period 60% higher, its context not (context); the same with its peers
                             # raised alike is the control that context should explain
    volume_jump: 0.6         # artefact: the source's volume and every count 60% higher in the last 3 periods
    duplicated_period: 1.0   # artefact: one recent period counted twice, volume and counts alike
  placebo_repeats: 5         # relationships: window and baseline reassigned at random, repeats
  backtest:
    every_months: 3
    back_months: 48
    confirm_months: 12       # a flag is confirmed when day 4's trend or level detectors agree this much later
  retain:                    # revised after the development run, before the recorded one (D-025)
    min_incremental: 0.10    # plants it is for that it catches and no day-4 detector does (share of plants)
    null_margin: 0.01        # false positives at most day 4's comparable detector's rate on the same nulls plus this
                             # (the band anomaly; day 4's trend for a long-run trend; day 4's new combinations for
                             # the relationship placebos)
    max_null_rate: 0.05      # and never more than this
    max_artefact_excess: 0.02  # flags per quiet series under an artefact, beyond day 4's rate on the same

new_detectors:               # the owner's switches (D-028): on where the evaluation passed; the others stay measured
  short_shift: false         # off: no incremental value (D-025); kept, to revisit with calibration later
  long_trend: false          # off: no incremental value
  structural_shift: false    # off: false positives above day 4's
  contextual_anomaly: false  # off as a detector (no incremental value); shown as an explanation (annotate_explained)
  decoupling: false          # off: little power
  fading_combination: true   # on (D-028): 39 of 40 planted class-pair breakdowns caught, placebo 0.0%
  jurisdiction_shift: true   # on (D-028): 73 of 80 planted country-class changes caught, placebo 0.2%
