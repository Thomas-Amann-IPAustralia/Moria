name: collect-daily

# Collects every daily source for the previous UTC day into the private R2 bucket.
# Schedules run only from the default branch. Logs are public: commands print counts and keys, never content.
on:
  schedule:
    - cron: "23 2 * * *"  # 02:23 UTC daily: the previous UTC day is complete
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to collect (YYYY-MM-DD); empty means yesterday"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: collect-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --quiet uv
      - name: Install dependencies (from the lockfile)
        run: uv sync --frozen
      - name: Environment check (the bucket must answer)
        run: uv run moria env-check --require store:r2
      - name: Collect
        env:
          DAY: ${{ inputs.day }}
        run: |
          if [ -n "$DAY" ]; then
            uv run moria collect-daily --store r2 --day "$DAY"
          else
            uv run moria collect-daily --store r2
          fi
