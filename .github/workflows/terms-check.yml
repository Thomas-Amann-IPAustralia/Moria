name: terms-check

# Checks every territory term and theme phrase against sampled days of GDELT GKG files (design §2.4): volumes
# worldwide and in .au domains. The hit samples (news titles) go only to the private R2 bucket; the job summary shows
# counts and flags. Run by hand, after editing the terms.
on:
  workflow_dispatch:
    inputs:
      end:
        description: "Last day sampled (YYYY-MM-DD); empty means yesterday"
        required: false
        default: ""
      weeks:
        description: "Sample one day a week for this many weeks"
        required: false
        default: "13"

permissions:
  contents: read

concurrency:
  group: terms-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --quiet uv
      - name: Install dependencies (from the lockfile)
        run: uv sync --frozen
      - name: Environment check (the bucket must answer)
        run: uv run moria env-check --require store:r2
      - name: Check the terms
        env:
          END: ${{ inputs.end }}
          WEEKS: ${{ inputs.weeks }}
        run: |
          args=(--store r2 --report terms-check.md --weeks "${WEEKS:-13}")
          if [ -n "$END" ]; then args+=(--end "$END"); fi
          uv run moria --quiet terms check "${args[@]}"
      - name: Summary (counts and flags only)
        if: always()
        run: |
          if [ -f terms-check.md ]; then cat terms-check.md >> "$GITHUB_STEP_SUMMARY"; fi
