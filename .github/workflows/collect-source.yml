name: collect-source

# Collects one source by hand into the private R2 bucket: for example the BigQuery patent counts (a dry run until the
# owner switches it on), the foresight syntheses (to see whether a runner gets past sites that refuse the build
# session), or a re-run after a source failed. With the source `discover`, it checks a new source's addresses from a
# runner instead (`moria discover`: status, type, item counts and feed links). Logs are public: commands print
# counts, keys and addresses, never content.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "A source id from `moria sources`, e.g. patent_cpc_counts, or discover"
        required: true
      day:
        description: "UTC day (YYYY-MM-DD); empty means yesterday"
        required: false
        default: ""
      backfill:
        description: "A first snapshot: every feed item, or every page in a sitemap"
        type: boolean
        required: false
        default: false
      urls:
        description: "discover only: addresses to check, separated by spaces"
        required: false
        default: ""
      match:
        description: "discover only: also list links matching this regular expression"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --quiet uv
      - name: Install dependencies (from the lockfile)
        run: uv sync --frozen
      - name: Environment check (the bucket must answer)
        run: uv run moria env-check --require store:r2
      - name: Discover
        if: inputs.source == 'discover'
        env:
          URLS: ${{ inputs.urls }}
          MATCH: ${{ inputs.match }}
        run: |
          read -ra list <<< "$URLS"
          re='^https?://[^[:space:]]+$'
          for u in "${list[@]}"; do
            if [[ ! "$u" =~ $re ]]; then echo "not an address: $u"; exit 2; fi
          done
          if [ -n "$MATCH" ]; then uv run moria discover --match "$MATCH" "${list[@]}"; else uv run moria discover "${list[@]}"; fi
      - name: Collect
        if: inputs.source != 'discover'
        env:
          SOURCE: ${{ inputs.source }}
          DAY: ${{ inputs.day }}
          BACKFILL: ${{ inputs.backfill }}
        run: |
          if [[ ! "$SOURCE" =~ ^[a-z0-9_]+$ ]]; then echo "source must be a source id"; exit 2; fi
          args=(--store r2)
          if [ -n "$DAY" ]; then args+=(--day "$DAY"); fi
          if [ "$BACKFILL" = "true" ]; then args+=(--backfill); fi
          uv run moria collect "$SOURCE" "${args[@]}"
